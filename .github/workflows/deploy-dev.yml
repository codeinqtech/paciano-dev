name: Paciano Dev Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to paciano-dev.codeinq.com
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Create frontend environment file
        working-directory: frontend
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> .env
          echo "VITE_APP_ENV=${{ secrets.VITE_APP_ENV }}" >> .env
          echo "VITE_MEDIA_URL=${{ secrets.VITE_MEDIA_URL }}" >> .env

      - name: Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: Check for old production URL
        working-directory: frontend
        run: |
          echo "===== CHECKING FOR frontend ====="


      - name: Deploy frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "frontend/dist/*"
          target: "/home/u688571317/domains/codeinq.com/public_html/paciano/"
          strip_components: 2
          overwrite: true

      - name: Deploy backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "backend/*"
          target: "/home/u688571317/domains/codeinq.com/public_html/paciano/backend/"
          strip_components: 1
          overwrite: true

      - name: Run Laravel commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/u688571317/domains/codeinq.com/public_html/paciano/backend

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force 

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
