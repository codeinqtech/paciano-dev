name: Paciano Dev Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to paciano-dev.codeinq.com
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create frontend environment file
        working-directory: frontend
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> .env
          echo "VITE_APP_ENV=${{ secrets.VITE_APP_ENV }}" >> .env
          echo "VITE_MEDIA_URL=${{ secrets.VITE_MEDIA_URL }}" >> .env

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build (assets must include images)
        working-directory: frontend
        run: |
          test -f dist/index.html
          test -d dist/assets
          js_count=$(find dist/assets -maxdepth 1 -type f -name '*.js' | wc -l)
          css_count=$(find dist/assets -maxdepth 1 -type f -name '*.css' | wc -l)
          img_count=$(find dist/assets -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l)
          echo "Built assets: js=${js_count} css=${css_count} images=${img_count}"
          if [ "$js_count" -lt 1 ] || [ "$css_count" -lt 1 ]; then
            echo "Missing JS/CSS in dist/assets"
            exit 1
          fi
          if [ "$img_count" -lt 20 ]; then
            echo "Too few image files in dist/assets — build or checkout may be incomplete"
            exit 1
          fi

      - name: Archive frontend dist (full tree)
        run: tar -czf frontend-dist.tar.gz -C frontend/dist .

      - name: Upload frontend archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: frontend-dist.tar.gz
          target: /home/u688571317/domains/codeinq.com/public_html/paciano/
          overwrite: true

      - name: Extract frontend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /home/u688571317/domains/codeinq.com/public_html/paciano
            tar -xzf frontend-dist.tar.gz
            rm -f frontend-dist.tar.gz
            img_count=$(find assets -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) 2>/dev/null | wc -l)
            echo "On server: image files in assets/: ${img_count}"
            if [ "${img_count}" -lt 20 ]; then
              echo "ERROR: image assets missing after extract"
              exit 1
            fi

      - name: Deploy backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "backend/*"
          target: "/home/u688571317/domains/codeinq.com/public_html/paciano/backend/"
          strip_components: 1
          overwrite: true

      - name: Run Laravel commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/u688571317/domains/codeinq.com/public_html/paciano/backend

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            mkdir -p public/uploads/banner/images public/uploads/banner/videos
            mkdir -p public/uploads/home public/uploads/reviews
            chmod -R 775 public/uploads 2>/dev/null || true
